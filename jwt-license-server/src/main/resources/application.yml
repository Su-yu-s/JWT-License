server:
  port: 8080

spring:
  datasource:
#    url: jdbc:mysql://localhost:3306/jwt?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
#    username: jwt
    url: jdbc:mysql://localhost:3306/jwt_license?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      idle-timeout: 30000
      max-lifetime: 1800000
      maximum-pool-size: 15
      minimum-idle: 5
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  # 管理员登录 Token 过期时间（秒），默认 24 小时
  admin-expiration: 86400
  # SDK JWT Token 默认过期时间（秒），默认 180 天
  sdk-default-expiration: 15552000
  # 授权 Key 加密主密钥（AES-256-GCM），生产环境务必修改
  key-encryption-secret: jwt-license-key-encryption-secret-change-me
  # Seat 超时时间（分钟），超过此时间无心跳视为离线
  seat-timeout-minutes: 5
