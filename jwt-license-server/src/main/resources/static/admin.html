<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>总览 - iK 授权管理后台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">iK</span>
        <div class="brand-text">
          <strong>授权管理后台</strong>
          <small>License Administration</small>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">导航</div>
        <div class="main-nav">
          <a href="admin.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>
            总览
          </a>
          <a href="products.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="14" height="12" rx="2"/><line x1="2" y1="7" x2="16" y2="7"/></svg>
            产品管理
          </a>
          <a href="keys.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="9" r="4"/><line x1="9.8" y1="11.8" x2="14" y2="16"/><line x1="12" y1="14" x2="15" y2="14"/></svg>
            授权 Key
          </a>
          <a href="sessions.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="12" height="14" rx="2"/><line x1="3" y1="5" x2="15" y2="5"/><circle cx="9" cy="10" r="2"/></svg>
            设备会话
          </a>
          <a href="audit.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h12v12H3z"/><path d="M6 6h6M6 9h4M6 12h2"/></svg>
            审计日志
          </a>
        </div>
      </nav>
      <div style="padding-top:8px;border-top:1px solid var(--clr-border);">
        <a href="login.html" class="nav-item" style="color:var(--clr-text-tertiary);" onclick="window.clearToken(); return true;">
          <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3H3v12h4"/><path d="M7 9h8"/><path d="M12 6l3 3-3 3"/></svg>
          退出登录
        </a>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-sm" id="menuToggle" type="button" aria-label="菜单">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
          </button>
          <div class="breadcrumb">
            <span>iK 授权管理</span>
            <span class="breadcrumb-sep">/</span>
            <span>总览</span>
          </div>
        </div>
        <div class="topbar-right">
          <span class="status-pill" style="font-size:11px;">
            <span class="status-dot"></span> 运行中
          </span>
          <div class="user-pill">
            <span class="user-avatar">A</span>
            <span id="usernameDisplay">admin</span>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1>总览</h1>
          <p>查看所有核心指标和最近动态。</p>
        </div>

        <!-- Quick Actions -->
        <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
          <a href="products.html" class="btn btn-primary btn-sm">
            <svg style="width:14px;height:14px;" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
            新建产品
          </a>
          <a href="keys.html" class="btn btn-secondary btn-sm">
            <svg style="width:14px;height:14px;" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="9" r="4"/><line x1="9.8" y1="11.8" x2="14" y2="16"/></svg>
            生成授权 Key
          </a>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
          <div class="stat-card">
            <div class="stat-label">租户数量</div>
            <div class="stat-value" id="statTenants">-</div>
            <div class="stat-sub">已接入业务主体</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">产品数量</div>
            <div class="stat-value" id="statProducts">-</div>
            <div class="stat-sub">可签发 JWT 的产品</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">授权 Key</div>
            <div class="stat-value" id="statKeys">-</div>
            <div class="stat-sub">已创建的授权凭证</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">活跃设备</div>
            <div class="stat-value" id="statSessions">-</div>
            <div class="stat-sub">当前占用席位的会话</div>
          </div>
        </div>

        <!-- Recent Audit -->
        <div class="card">
          <div class="card-header">
            <div>
              <h2>最近审计</h2>
              <p>最近 10 条管理操作与授权事件。</p>
            </div>
            <a href="audit.html" class="btn btn-secondary btn-sm">查看全部</a>
          </div>
          <div class="card-body" id="auditList" style="padding:0;">
            <div style="padding:40px;text-align:center;color:var(--clr-text-tertiary);">加载中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <script src="js/common.js"></script>
  <script>
    // 校验登录状态（common.js 已加载，isLoggedIn 可用）
    if (!window.isLoggedIn()) { window.location.href = 'login.html'; }
    (function () {
      var info = window.getUserInfo();
      if (info) { document.getElementById('usernameDisplay').textContent = info.username || 'admin'; }
    })();
  </script>
  <script>
    (function () {
      apiGet('/dashboard/stats')
        .then(function (res) {
          var d = res.data;
          document.getElementById('statTenants').textContent = d.tenantCount || 0;
          document.getElementById('statProducts').textContent = d.productCount || 0;
          document.getElementById('statKeys').textContent = d.keyCount || 0;
          document.getElementById('statSessions').textContent = d.activeSessionCount || 0;
        })
        .catch(function (err) { console.error('Failed to load stats:', err); });

      apiGet('/dashboard/recent-audit', { limit: 10 })
        .then(function (res) {
          var list = res.data || [];
          var html = '';
          if (list.length === 0) {
            html = '<div style="padding:40px;text-align:center;color:var(--clr-text-tertiary);">暂无审计记录</div>';
          } else {
            html = '<table style="table-layout:fixed;width:100%;"><thead><tr>'
              + '<th style="width:150px;white-space:nowrap;">时间</th>'
              + '<th>事件详情</th>'
              + '<th style="width:100px;text-align:left;">操作者</th>'
              + '</tr></thead><tbody>';
            for (var i = 0; i < list.length; i++) {
              var item = list[i];
              var et = item.eventType || '';
              var badgeClass = 'badge-info';
              if (et.indexOf('ACTIVATE') !== -1 || et.indexOf('REVOKED') !== -1) badgeClass = 'badge-active';
              else if (et.indexOf('DISABLED') !== -1) badgeClass = 'badge-disabled';
              else if (et.indexOf('EXPIRED') !== -1) badgeClass = 'badge-expired';
              else if (et.indexOf('LOGIN') !== -1) badgeClass = 'badge-info';

              html += '<tr>'
                + '<td><span style="font-size:13px;color:var(--clr-text-tertiary);font-family:var(--font-mono);">'
                + (item.createdAt || '-') + '</span></td>'
                + '<td><span style="font-size:13px;color:var(--clr-text);line-height:1.55;display:inline-block;">'
                + '<span class="badge ' + badgeClass + '" style="margin-right:8px;">' + et + '</span>'
                + (item.eventDetail || '') + '</span></td>'
                + '<td><strong style="display:block;font-size:14px;color:var(--clr-text);font-weight:700;">'
                + (item.operator || '-') + '</strong>'
                + '<span style="font-size:13px;color:var(--clr-text-secondary);">'
                + (item.operatorType || '后台操作') + '</span></td>'
                + '</tr>';
            }
            html += '</tbody></table>';
          }
          document.getElementById('auditList').innerHTML = html;
        })
        .catch(function (err) {
          document.getElementById('auditList').innerHTML = '<div style="padding:40px;text-align:center;color:var(--clr-text-tertiary);">加载失败</div>';
        });

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
