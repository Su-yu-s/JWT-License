<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权 Key - iK 授权管理后台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">iK</span>
        <div class="brand-text">
          <strong>授权管理后台</strong>
          <small>License Administration</small>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">导航</div>
        <div class="main-nav">
          <a href="admin.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>总览</a>
          <a href="products.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="14" height="12" rx="2"/><line x1="2" y1="7" x2="16" y2="7"/></svg>产品管理</a>
          <a href="keys.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="9" r="4"/><line x1="9.8" y1="11.8" x2="14" y2="16"/><line x1="12" y1="14" x2="15" y2="14"/></svg>授权 Key</a>
          <a href="sessions.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="12" height="14" rx="2"/><line x1="3" y1="5" x2="15" y2="5"/><circle cx="9" cy="10" r="2"/></svg>设备会话</a>
          <a href="audit.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h12v12H3z"/><path d="M6 6h6M6 9h4M6 12h2"/></svg>审计日志</a>
        </div>
      </nav>
      <div style="padding-top:8px;border-top:1px solid var(--clr-border);">
        <a href="login.html" class="nav-item" style="color:var(--clr-text-tertiary);" onclick="window.clearToken(); return true;">退出登录</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-sm" id="menuToggle" type="button">菜单</button>
          <div class="breadcrumb"><span>iK 授权管理</span><span class="breadcrumb-sep">/</span><span>授权 Key</span></div>
        </div>
        <div class="topbar-right">
          <span class="status-pill" style="font-size:11px;"><span class="status-dot"></span>运行中</span>
          <div class="user-pill"><span class="user-avatar">A</span><span id="usernameDisplay">admin</span></div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1>授权 Key 管理</h1>
          <p>生成、查看和禁用授权 Key；每个 Key 同一时间仅允许一台设备使用。</p>
        </div>

        <!-- Create Key Form -->
        <div class="card" style="margin-bottom:24px;">
          <div style="padding:20px 24px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;">
            <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="key-product">产品</label>
              <select class="form-select" id="key-product">
                <option value="">加载中...</option>
              </select>
            </div>
            <div style="flex:2;min-width:200px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="key-assignee">分配对象</label>
              <input class="form-input" id="key-assignee" type="text" placeholder="客户名、公司名或订单号">
            </div>
            <div style="flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="key-grip">离线宽限(分)</label>
              <input class="form-input" id="key-grip" type="number" min="1" value="1440">
            </div>
            <div style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="key-expiry">使用期限</label>
              <select class="form-select" id="key-expiry">
                <option value="1y">1 年</option>
                <option value="3y">3 年</option>
                <option value="5y">5 年</option>
                <option value="10y">10 年</option>
                <option value="forever" selected>长期有效</option>
              </select>
            </div>
            <div style="display:flex;align-items:flex-end;">
              <button class="btn btn-primary" id="generateKeyBtn" onclick="generateKey()">生成 Key</button>
            </div>
          </div>
        </div>

        <!-- Key List -->
        <div class="card">
          <div class="card-header">
            <div><h2>Key 列表</h2><p>按创建时间倒序展示。</p></div>
            <div style="display:flex;gap:8px;align-items:center;">
              <select class="form-select" id="keyStatusFilter" style="width:100px;min-height:36px;padding-right:28px;font-size:13px;" onchange="loadKeys()">
                <option value="">全部状态</option>
                <option value="1">启用</option>
                <option value="0">已禁用</option>
                <option value="2">已过期</option>
              </select>
              <div style="position:relative;">
                <input class="form-input" id="keySearchInput" type="text" placeholder="搜索 Key..." style="width:180px;padding-right:32px;font-size:13px;" oninput="filterKeys()">
                <svg style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;" viewBox="0 0 16 16" fill="none" stroke="#999" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14" y2="14"/></svg>
              </div>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Key</th><th>产品名称</th><th>分配对象</th><th>状态</th><th>过期时间</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="keyTableBody">
                <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--clr-text-tertiary);">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <!-- Key Detail Modal -->
  <div id="tenantModal" class="modal-mask" style="display:none;" onclick="if(event.target===this)hideModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Key 详情</h3>
        <button class="btn btn-ghost" onclick="hideModal()" title="关闭">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // 校验登录状态（common.js 已加载，isLoggedIn 可用）
    if (!window.isLoggedIn()) { window.location.href = 'login.html'; }
  </script>
  <script>
    // User info
    (function () {
      var info = window.getUserInfo();
      if (info) { document.getElementById('usernameDisplay').textContent = info.username || 'admin'; }
    })();

    var keyData = [];

    // Load products for dropdown
    (function () {
      apiGet('/products')
        .then(function (res) {
          var products = res.data || [];
          var sel = document.getElementById('key-product');
          if (products.length === 0) {
            sel.innerHTML = '<option value="">暂无产品，请先创建</option>';
            return;
          }
          var html = '<option value="">请选择产品</option>';
          for (var i = 0; i < products.length; i++) {
            var p = products[i];
            html += '<option value="' + escapeHtml(p.productId) + '">' + escapeHtml(p.name) + '</option>';
          }
          sel.innerHTML = html;
        })
        .catch(function (err) {
          console.error('Failed to load products:', err);
        });
      loadKeys();
    })();

    function generateKey() {
      var productId = document.getElementById('key-product').value;
      var assignee = document.getElementById('key-assignee').value.trim();
      var grip = parseInt(document.getElementById('key-grip').value) || 1440;
      var expiryVal = document.getElementById('key-expiry').value;

      if (!productId) { window.toast('请选择产品', 'error'); return; }

      var btn = document.getElementById('generateKeyBtn');
      btn.disabled = true;
      btn.textContent = '生成中...';

      // Convert expiry to date
      var expiresAt = null;
      if (expiryVal !== 'forever') {
        var years = parseInt(expiryVal);
        var now = new Date();
        var exp = new Date(now.getFullYear() + years, now.getMonth(), now.getDate(), now.getHours(), now.getMinutes());
        expiresAt = exp.toISOString().slice(0, 16).replace('T', ' ');
      }

      // 使用 AbortController 设置请求超时（30秒），防止按钮永久卡死
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 30000);

      apiPost('/license-keys', {
        productId: productId,
        assignee: assignee,
        gripMinutes: grip,
        expiresAt: expiresAt || null
      }, { signal: controller.signal })
        .then(function (res) {
          clearTimeout(timer);
          window.toast('Key 生成成功: ' + res.data.keyCode);
          document.getElementById('key-assignee').value = '';
          loadKeys();
        })
        .catch(function (err) {
          clearTimeout(timer);
          // 区分超时和其他错误
          if (err.name === 'AbortError' || err.message.indexOf('abort') !== -1) {
            window.toast('请求超时，请检查网络连接或稍后重试', 'error');
          } else {
            window.toast(err.message || '请求失败', 'error');
          }
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = '生成 Key';
        });
    }

    function loadKeys() {
      apiGet('/license-keys', { page: 1, size: 50 })
        .then(function (res) {
          var items = (res.data && res.data.records) || [];
          keyData = items;
          applyKeyFilters();
        })
        .catch(function (err) {
          document.getElementById('keyTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--clr-danger);">加载失败: ' + escapeHtml(err.message) + '</td></tr>';
        });
    }

    function applyKeyFilters() {
      var statusFilter = document.getElementById('keyStatusFilter').value;
      var keyword = (document.getElementById('keySearchInput').value || '').trim().toLowerCase();

      var filtered = keyData;
      if (statusFilter) {
        filtered = filtered.filter(function (k) { return k.status === parseInt(statusFilter); });
      }
      if (keyword) {
        filtered = filtered.filter(function (k) {
          return (k.keyCode || '').toLowerCase().indexOf(keyword) !== -1
            || (k.productName || '').toLowerCase().indexOf(keyword) !== -1
            || (k.assignee || '').toLowerCase().indexOf(keyword) !== -1;
        });
      }
      renderKeyTable(filtered);
    }

    function filterKeys() {
      applyKeyFilters();
    }

    function renderKeyTable(keys) {
      var tbody = document.getElementById('keyTableBody');
      if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--clr-text-tertiary);">暂无授权 Key</td></tr>';
        return;
      }
      var html = '';
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var statusClass = k.status === 1 ? 'badge-active'
          : k.status === 0 ? 'badge-disabled'
          : k.status === 2 ? 'badge-expired' : 'badge-info';
        var statusText = k.status === 1 ? '启用'
          : k.status === 0 ? '已禁用'
          : k.status === 2 ? '已过期' : '未知';

        html += '<tr>'
          + '<td><code>' + escapeHtml(k.keyCode) + '</code></td>'
          + '<td>' + escapeHtml(k.productName || '-') + '</td>'
          + '<td>' + (k.assignee ? escapeHtml(k.assignee) : '<span class="text-muted">未分配</span>') + '</td>'
          + '<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>'
          + '<td class="text-mono">' + formatDate(k.expiresAt) + '</td>'
          + '<td style="display:flex;gap:6px;align-items:center;">'
          + '<button class="btn btn-secondary btn-sm" onclick="showKeyDetail(' + k.id + ')">详情</button>'
          + (k.status === 1 ? ' <button class="btn btn-sm" style="color:var(--clr-danger);" onclick="disableKey(' + k.id + ')">禁用</button>' : '')
          + ' <button class="btn btn-sm" style="color:var(--clr-danger);" onclick="deleteKey(' + k.id + ')">删除</button>'
          + '</td></tr>';
      }
      tbody.innerHTML = html;
    }

    function disableKey(id) {
      if (!window.confirmAction('确认禁用此 Key？')) return;
      apiPatch('/license-keys/' + id + '/disable')
        .then(function () {
          window.toast('Key 已禁用');
          loadKeys();
        })
        .catch(function (err) { window.toast(err.message, 'error'); });
    }

    function deleteKey(id) {
      if (!window.confirmAction('确认删除此 Key？删除后无法恢复。')) return;
      apiDelete('/license-keys/' + id)
        .then(function () {
          window.toast('Key 已删除');
          loadKeys();
        })
        .catch(function (err) { window.toast(err.message, 'error'); });
    }

    function showKeyDetail(id) {
      apiGet('/license-keys/' + id)
        .then(function (res) {
          var k = res.data;
          var statusClass = k.status === 1 ? 'badge-active' : k.status === 0 ? 'badge-disabled' : 'badge-expired';
          var statusText = k.status === 1 ? '启用' : k.status === 0 ? '已禁用' : k.status === 2 ? '已过期' : '未知';

          var fields = [
            ['Key', '<code>' + escapeHtml(k.keyCode) + '</code> <button class="btn btn-secondary btn-sm" onclick="copyText(\'' + escapeHtml(k.keyCode) + '\',this)" style="margin-left:6px;">复制</button>'],
            ['产品名称', escapeHtml(k.productName) || '-'],
            ['产品 ID', escapeHtml(k.productId) || '-'],
            ['分配对象', k.assignee || '<span class="text-muted">未分配</span>'],
            ['离线宽限', (k.gripMinutes || 1440) + ' 分钟'],
            ['状态', '<span class="badge ' + statusClass + '">' + statusText + '</span>'],
            ['过期时间', formatDate(k.expiresAt) || '永久'],
            ['创建人', k.createdBy || 'admin'],
            ['创建时间', formatDate(k.createdAt)],
          ];

          var detailHtml = '<div class="detail-grid">';
          for (var i = 0; i < fields.length; i++) {
            detailHtml += '<div class="detail-field"><span class="detail-label">' + fields[i][0] + '</span><span class="detail-value">' + fields[i][1] + '</span></div>';
          }
          detailHtml += '</div>';

          document.getElementById('modalTitle').textContent = 'Key 详情';
          document.getElementById('modalBody').innerHTML = detailHtml
            + '<div class="modal-actions"><button class="btn btn-secondary" onclick="hideModal()">关闭</button></div>';
          document.getElementById('tenantModal').style.display = 'flex';
        })
        .catch(function (err) { window.toast('获取详情失败: ' + err.message, 'error'); });
    }

    function hideModal() {
      document.getElementById('tenantModal').style.display = 'none';
    }

    function formatDate(d) {
      if (!d) return '-';
      return d.replace('T', ' ').substring(0, 16);
    }

    function escapeHtml(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
