<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审计日志 - iK 授权管理后台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">iK</span>
        <div class="brand-text">
          <strong>授权管理后台</strong>
          <small>License Administration</small>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">导航</div>
        <div class="main-nav">
          <a href="admin.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>总览</a>
          <a href="products.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="14" height="12" rx="2"/><line x1="2" y1="7" x2="16" y2="7"/></svg>产品管理</a>
          <a href="keys.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="9" r="4"/><line x1="9.8" y1="11.8" x2="14" y2="16"/><line x1="12" y1="14" x2="15" y2="14"/></svg>授权 Key</a>
          <a href="sessions.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="12" height="14" rx="2"/><line x1="3" y1="5" x2="15" y2="5"/><circle cx="9" cy="10" r="2"/></svg>设备会话</a>
          <a href="audit.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h12v12H3z"/><path d="M6 6h6M6 9h4M6 12h2"/></svg>审计日志</a>
        </div>
      </nav>
      <div style="padding-top:8px;border-top:1px solid var(--clr-border);">
        <a href="login.html" class="nav-item" style="color:var(--clr-text-tertiary);" onclick="window.clearToken(); return true;">退出登录</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-sm" id="menuToggle" type="button">菜单</button>
          <div class="breadcrumb"><span>iK 授权管理</span><span class="breadcrumb-sep">/</span><span>审计日志</span></div>
        </div>
        <div class="topbar-right">
          <span class="status-pill" style="font-size:11px;"><span class="status-dot"></span>运行中</span>
          <div class="user-pill"><span class="user-avatar">A</span><span id="usernameDisplay">admin</span></div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1>审计日志</h1>
          <p>追踪产品、Key 和设备会话相关的后台操作与授权事件。</p>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom:24px;">
          <div style="padding:16px 24px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:2;min-width:200px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="keywordFilter">关键词搜索</label>
              <input class="form-input" id="keywordFilter" type="text" placeholder="搜索事件描述或操作者" onkeydown="if(event.key==='Enter')loadAuditLogs()">
            </div>
            <div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="eventTypeFilter">事件类型</label>
              <select class="form-select" id="eventTypeFilter">
                <option value="">全部</option>
                <option value="KEY_CREATED">Key 创建</option>
                <option value="KEY_DISABLED">Key 禁用</option>
                <option value="KEY_EXPIRED">Key 过期</option>
                <option value="KEY_DELETED">Key 删除</option>
                <option value="SESSION_ACTIVATE">设备激活</option>
                <option value="SESSION_REVOKED">会话撤销</option>
                <option value="SESSION_CLEARED">清理超时</option>
                <option value="PRODUCT_CREATED">产品创建</option>
                <option value="ADMIN_LOGIN">管理员登录</option>
              </select>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-end;">
              <button class="btn btn-secondary btn-sm" onclick="resetAuditFilters()">重置</button>
              <button class="btn btn-primary btn-sm" onclick="loadAuditLogs()">搜索</button>
            </div>
          </div>
        </div>

        <!-- Audit List -->
        <div class="card">
          <div class="card-header">
            <div><h2>全部记录</h2><p>按创建时间倒序展示，最近 200 条。</p></div>
            <span style="font-size:13px;color:var(--clr-text-tertiary);" id="pageInfo">共 0 条</span>
          </div>
          <div class="card-body" id="auditList" style="padding:0;">
            <div style="padding:40px;text-align:center;color:var(--clr-text-tertiary);">加载中...</div>
          </div>
          <!-- Pagination -->
          <div class="pagination">
            <span style="font-size:13px;color:var(--clr-text-tertiary);" id="pageInfoBottom"></span>
            <div class="pagination-btns">
              <button class="btn btn-ghost btn-sm" onclick="changePage(-1)">上一页</button>
              <button class="btn btn-ghost btn-sm" onclick="changePage(1)">下一页</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <script src="js/common.js"></script>
  <script>
    // 校验登录状态（common.js 已加载，isLoggedIn 可用）
    if (!window.isLoggedIn()) { window.location.href = 'login.html'; }
  </script>
  <script>
    (function () {
      var info = window.getUserInfo();
      if (info) { document.getElementById('usernameDisplay').textContent = info.username || 'admin'; }
    })();

    var currentPage = 1;
    var totalPages = 1;
    var currentEventType = '';
    var currentKeyword = '';

    (function () {
      loadAuditLogs();
    })();

    function loadAuditLogs() {
      currentEventType = document.getElementById('eventTypeFilter').value;
      currentKeyword = document.getElementById('keywordFilter').value.trim();

      var params = {
        page: currentPage,
        size: 50,
      };
      if (currentEventType) params.eventType = currentEventType;
      if (currentKeyword) params.keyword = currentKeyword;

      apiGet('/audit-logs', params)
        .then(function (res) {
          var data = res.data || {};
          var items = data.records || [];
          var total = data.total || 0;
          var size = data.size || 50;
          totalPages = Math.ceil(total / size) || 1;

          var container = document.getElementById('auditList');
          if (items.length === 0) {
            container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--clr-text-tertiary);">暂无审计记录</div>';
          } else {
            var html = '<table style="table-layout:fixed;width:100%;"><thead><tr>'
              + '<th style="width:150px;white-space:nowrap;">时间</th>'
              + '<th>事件详情</th>'
              + '<th style="width:100px;text-align:left;">操作者</th>'
              + '</tr></thead><tbody>';
            for (var i = 0; i < items.length; i++) {
              var item = items[i];
              var badgeClass = getBadgeClass(item.eventType);

              html += '<tr>'
                + '<td><span style="font-size:13px;color:var(--clr-text-tertiary);font-family:var(--font-mono);">'
                + formatDateTime(item.createdAt) + '</span></td>'
                + '<td><span style="margin:0 0 6px;display:inline-block;font-size:13px;color:var(--clr-text);line-height:1.55;">'
                + '<span class="badge ' + badgeClass + '" style="margin-right:8px;">' + escapeHtml(item.eventType) + '</span>'
                + escapeHtml(item.eventDetail) + '</span></td>'
                + '<td><strong style="display:block;font-size:14px;color:var(--clr-text);font-weight:700;">'
                + escapeHtml(item.operator) + '</strong>'
                + '<span style="font-size:13px;color:var(--clr-text-secondary);">'
                + escapeHtml(item.operatorType || '后台操作') + '</span></td>'
                + '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
          }

          document.getElementById('pageInfo').textContent = '共 ' + total + ' 条';
          document.getElementById('pageInfoBottom').textContent = '第 ' + currentPage + '/' + totalPages + ' 页';
        })
        .catch(function (err) {
          document.getElementById('auditList').innerHTML = '<div style="padding:40px;text-align:center;color:var(--clr-danger);">加载失败: ' + escapeHtml(err.message) + '</div>';
        });
    }

    function changePage(delta) {
      var newPage = currentPage + delta;
      if (newPage < 1) newPage = 1;
      if (newPage > totalPages) newPage = totalPages;
      if (newPage === currentPage) return;
      currentPage = newPage;
      loadAuditLogs();
    }

    function getBadgeClass(eventType) {
      if (eventType.indexOf('ACTIVATE') !== -1 || eventType.indexOf('REVOKED') !== -1) return 'badge-active';
      if (eventType.indexOf('DISABLED') !== -1 || eventType.indexOf('EXPIRED') !== -1) return 'badge-disabled';
      if (eventType.indexOf('DELETED') !== -1) return 'badge-expired';
      return 'badge-info';
    }

    function resetAuditFilters() {
      document.getElementById('eventTypeFilter').value = '';
      document.getElementById('keywordFilter').value = '';
      currentPage = 1;
      loadAuditLogs();
    }

    function formatDateTime(d) {
      if (!d) return '-';
      return d.replace('T', ' ').substring(0, 19);
    }

    function escapeHtml(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
