<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品管理 - iK 授权管理后台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">iK</span>
        <div class="brand-text">
          <strong>授权管理后台</strong>
          <small>License Administration</small>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">导航</div>
        <div class="main-nav">
          <a href="admin.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>总览</a>
          <a href="products.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="14" height="12" rx="2"/><line x1="2" y1="7" x2="16" y2="7"/></svg>产品管理</a>
          <a href="keys.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="9" r="4"/><line x1="9.8" y1="11.8" x2="14" y2="16"/><line x1="12" y1="14" x2="15" y2="14"/></svg>授权 Key</a>
          <a href="sessions.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="12" height="14" rx="2"/><line x1="3" y1="5" x2="15" y2="5"/><circle cx="9" cy="10" r="2"/></svg>设备会话</a>
          <a href="audit.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h12v12H3z"/><path d="M6 6h6M6 9h4M6 12h2"/></svg>审计日志</a>
        </div>
      </nav>
      <div style="padding-top:8px;border-top:1px solid var(--clr-border);">
        <a href="login.html" class="nav-item" style="color:var(--clr-text-tertiary);" onclick="window.clearToken(); return true;">退出登录</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-sm" id="menuToggle" type="button">菜单</button>
          <div class="breadcrumb"><span>iK 授权管理</span><span class="breadcrumb-sep">/</span><span>产品管理</span></div>
        </div>
        <div class="topbar-right">
          <span class="status-pill" style="font-size:11px;"><span class="status-dot"></span>运行中</span>
          <div class="user-pill"><span class="user-avatar">A</span><span id="usernameDisplay">admin</span></div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1>产品管理</h1>
          <p>为每个产品维护独立的 Audience 与 RS256 签名密钥。</p>
        </div>

        <!-- Create Form -->
        <div class="card" style="margin-bottom:24px;">
          <div style="padding:20px 24px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;">
            <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="tenant-input">租户名</label>
              <div style="display:flex;gap:8px;">
                <input class="form-input" id="tenant-input" list="tenant-list" placeholder="选择或输入租户名" style="flex:1;">
                <datalist id="tenant-list"></datalist>
                <button class="btn btn-secondary btn-sm" onclick="showCreateTenant()" title="新建租户">+ 新建</button>
              </div>
            </div>
            <div style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px;">
              <label class="form-label" for="product-name">产品名称</label>
              <input class="form-input" id="product-name" type="text" placeholder="例如：桌面客户端">
            </div>
            <div style="display:flex;align-items:flex-end;">
              <button class="btn btn-primary" id="createProductBtn" onclick="createProduct()">创建产品</button>
            </div>
          </div>
        </div>

        <!-- Product List -->
        <div class="card">
          <div class="card-header">
            <div><h2>产品列表</h2><p>查看每个产品的产品 ID、归属租户和当前状态。</p></div>
            <div style="position:relative;">
              <input class="form-input" id="productSearchInput" type="text" placeholder="搜索产品..." style="width:200px;padding-right:32px;" oninput="filterProducts()">
              <svg style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none;" viewBox="0 0 16 16" fill="none" stroke="#999" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14" y2="14"/></svg>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>产品名称</th><th>产品 ID</th><th>租户</th><th>状态</th><th>创建时间</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="productTableBody">
                <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--clr-text-tertiary);">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <!-- Create Tenant Modal -->
  <div id="tenantModal" class="modal-mask" style="display:none;" onclick="if(event.target===this)hideCreateTenant()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">新建租户</h3>
        <button class="btn btn-ghost" onclick="hideCreateTenant()" title="关闭">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // User info
    (function () {
      var info = window.getUserInfo();
      if (info) { document.getElementById('usernameDisplay').textContent = info.username || 'admin'; }
    })();

    var productList = [];

    // Load tenants into datalist
    apiGet('/tenants')
      .then(function (res) {
        var tenants = res.data || [];
        var dl = document.getElementById('tenant-list');
        var opts = '';
        for (var i = 0; i < tenants.length; i++) {
          var t = tenants[i];
          opts += '<option value="' + t.code + '" label="' + escapeHtml(t.name) + '"></option>';
        }
        dl.innerHTML = opts;
      })
      .catch(function () {});

    // Load products
    loadProducts();

    // Auto-generate product ID from name (sync with backend)
    (function () {
      var nameInput = document.getElementById('product-name');
      var tenantInput = document.getElementById('tenant-input');
      if (nameInput && tenantInput) {
        var timer = null;
        function regenerate() {
          clearTimeout(timer);
          timer = setTimeout(function () {
            var nameVal = nameInput.value.trim();
            var tenantVal = tenantInput.value.trim();
            if (!nameVal) return;
            var tenantPrefix = tenantVal.length > 6
              ? tenantVal.substring(0, 6).toLowerCase()
              : tenantVal.toLowerCase();
            var slug = nameVal.toLowerCase().replace(/[^a-z0-9一-鿿]/g, '');
            var result = '';
            for (var i = 0; i < slug.length; i++) {
              var c = slug[i];
              var code = c.charCodeAt(0);
              if (code >= 0x4e00 && code <= 0x9fff) {
                var offset = code - 0x4e00;
                var groups = [
                  {start:0, len:100, ch:'a'},{start:100,len:100, ch:'b'},{start:200,len:100, ch:'c'},
                  {start:300,len:100, ch:'d'},{start:400,len:50,  ch:'e'},{start:450,len:100, ch:'f'},
                  {start:550,len:150, ch:'g'},{start:700,len:150, ch:'h'},{start:850,len:100, ch:'j'},
                  {start:950,len:100, ch:'k'},{start:1050,len:150,ch:'l'},{start:1200,len:150, ch:'m'},
                  {start:1350,len:150, ch:'n'},{start:1500,len:20, ch:'o'},{start:1520,len:130, ch:'p'},
                  {start:1650,len:200, ch:'q'},{start:1850,len:50, ch:'r'},{start:1900,len:200, ch:'s'},
                  {start:2100,len:200, ch:'t'},{start:2300,len:200, ch:'w'},{start:2500,len:200, ch:'x'},
                  {start:2700,len:300, ch:'y'},{start:3000,len:200, ch:'z'},
                ];
                var letter = 'z';
                for (var g = 0; g < groups.length; g++) {
                  if (offset >= groups[g].start && offset < groups[g].start + groups[g].len) {
                    letter = groups[g].ch; break;
                  }
                }
                result += letter;
              } else {
                result += c;
              }
            }
            result = result.replace(/-+/g, '-').replace(/^-|-$/g, '');
            if (!result) result = 'app';
            var nextSeq = (productList.length + 1).toString().padStart(2, '0');
            var autoId = tenantPrefix + '-' + result + '-' + nextSeq;
            // Visual hint on the create button
            var btn = document.getElementById('createProductBtn');
            btn.setAttribute('data-hint', autoId);
          }, 300);
        }
        nameInput.addEventListener('input', regenerate);
        tenantInput.addEventListener('input', regenerate);
      }
    })();

    function loadProducts() {
      apiGet('/products')
        .then(function (res) {
          productList = res.data || [];
          renderProductTable(productList);
        })
        .catch(function (err) {
          document.getElementById('productTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--clr-danger);">加载失败: ' + escapeHtml(err.message) + '</td></tr>';
        });
    }

    function renderProductTable(products) {
      var tbody = document.getElementById('productTableBody');
      if (products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--clr-text-tertiary);">暂无产品</td></tr>';
        return;
      }
      var html = '';
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var statusBadge = p.status === 1
          ? '<span class="badge badge-active">启用</span>'
          : '<span class="badge badge-disabled">已禁用</span>';
        var statusText = p.status === 1 ? '禁用' : '启用';
        var statusAction = p.status === 1
          ? '<button class="btn btn-secondary btn-sm" onclick="toggleProductStatus(' + p.id + ',0)">禁用</button>'
          : '<button class="btn btn-sm" style="color:var(--clr-success);" onclick="toggleProductStatus(' + p.id + ',1)">启用</button>';

        html += '<tr data-name="' + escapeHtml(p.name).toLowerCase() + '" data-tenant="' + escapeHtml(p.tenantCode || '').toLowerCase() + '">'
          + '<td><strong>' + escapeHtml(p.name) + '</strong></td>'
          + '<td><span class="product-id-code">' + escapeHtml(p.productId) + '</span>'
          + ' <button class="btn btn-secondary btn-sm" onclick="copyText(\'' + escapeHtml(p.productId) + '\',this)">复制</button></td>'
          + '<td>' + escapeHtml(p.tenantCode || '-') + '</td>'
          + '<td>' + statusBadge + '</td>'
          + '<td class="text-mono">' + formatDate(p.createdAt) + '</td>'
          + '<td style="display:flex;gap:6px;align-items:center;">'
          + '<button class="btn btn-secondary btn-sm" onclick="showProductDetail(' + p.id + ')">详情</button>'
          + statusAction
          + ' <button class="btn btn-sm" style="color:var(--clr-danger);" onclick="deleteProduct(' + p.id + ')">删除</button>'
          + '</td></tr>';
      }
      tbody.innerHTML = html;
    }

    function filterProducts() {
      var keyword = document.getElementById('productSearchInput').value.trim().toLowerCase();
      if (!keyword) {
        renderProductTable(productList);
        return;
      }
      var filtered = productList.filter(function (p) {
        return p.name.toLowerCase().indexOf(keyword) !== -1
          || (p.tenantCode && p.tenantCode.toLowerCase().indexOf(keyword) !== -1)
          || (p.productId && p.productId.toLowerCase().indexOf(keyword) !== -1);
      });
      renderProductTable(filtered);
    }

    function createProduct() {
      var name = document.getElementById('product-name').value.trim();
      var tenantCode = document.getElementById('tenant-input').value.trim();

      if (!name) { window.toast('请输入产品名称', 'error'); return; }
      if (!tenantCode) { window.toast('请选择或输入所属租户', 'error'); return; }

      // Get auto-generated product ID from button hint
      var btn = document.getElementById('createProductBtn');
      var productId = btn.getAttribute('data-hint') || null;

      document.getElementById('createProductBtn').disabled = true;
      document.getElementById('createProductBtn').textContent = '创建中...';

      apiPost('/products', {
        tenantCode: tenantCode,
        name: name,
        productId: productId || null
      })
        .then(function (res) {
          window.toast('产品创建成功');
          document.getElementById('product-name').value = '';
          btn.removeAttribute('data-hint');
          hideCreateTenant();
          loadProducts();
        })
        .catch(function (err) {
          window.toast(err.message, 'error');
        })
        .finally(function () {
          document.getElementById('createProductBtn').disabled = false;
          document.getElementById('createProductBtn').textContent = '创建产品';
        });
    }

    function deleteProduct(id) {
      if (!window.confirmAction('确认删除此产品？删除后无法恢复。')) return;
      apiDelete('/products/' + id)
        .then(function () {
          window.toast('产品已删除');
          loadProducts();
        })
        .catch(function (err) {
          window.toast(err.message, 'error');
        });
    }

    function toggleProductStatus(id, status) {
      var action = status === 0 ? '禁用' : '启用';
      if (!window.confirmAction('确认' + action + '此产品？')) return;
      var token = window.getToken();
      fetch(window.API_BASE + '/products/' + id + '/status?status=' + status, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + token }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.code !== 200) throw new Error(res.message);
          window.toast('状态已更新');
          loadProducts();
        })
        .catch(function (err) { window.toast('操作失败: ' + err.message, 'error'); });
    }

    // ---- Tenant Creation & Detail Modal ----
    function showCreateTenant() {
      document.getElementById('modalTitle').textContent = '新建租户';
      document.getElementById('modalBody').innerHTML =
        '<div style="margin-bottom:16px;"><label class="form-label" for="new-tenant-code">租户名</label>'
        + '<input class="form-input" id="new-tenant-code" type="text" placeholder="如：my_company" style="min-height:40px;"></div>'
        + '<div class="modal-actions"><button class="btn btn-secondary" onclick="hideCreateTenant()">取消</button>'
        + '<button class="btn btn-primary" onclick="createTenant()">创建</button></div>';
      document.getElementById('tenantModal').style.display = 'flex';
      setTimeout(function () {
        var input = document.getElementById('new-tenant-code');
        if (input) input.focus();
      }, 100);
    }

    function hideCreateTenant() {
      document.getElementById('tenantModal').style.display = 'none';
    }

    function createTenant() {
      var code = document.getElementById('new-tenant-code').value.trim();
      if (!code) { window.toast('请输入租户名', 'error'); return; }
      document.getElementById('createProductBtn').disabled = true;

      apiPost('/tenants', { code: code, name: code })
        .then(function (res) {
          window.toast('租户创建成功');
          document.getElementById('tenant-input').value = code;
          refreshTenantList();
          hideCreateTenant();
        })
        .catch(function (err) {
          window.toast(err.message, 'error');
        })
        .finally(function () {
          document.getElementById('createProductBtn').disabled = false;
        });
    }

    function refreshTenantList() {
      apiGet('/tenants')
        .then(function (res) {
          var tenants = res.data || [];
          var dl = document.getElementById('tenant-list');
          var opts = '';
          for (var i = 0; i < tenants.length; i++) {
            var t = tenants[i];
            opts += '<option value="' + t.code + '" label="' + escapeHtml(t.name) + '"></option>';
          }
          dl.innerHTML = opts;
        })
        .catch(function () {});
    }

    function showProductDetail(id) {
      apiGet('/products/' + id)
        .then(function (res) {
          var p = res.data;
          if (!p) throw new Error('未获取到产品信息');
          var detailHtml = '<div class="detail-grid">'
            + '<div class="detail-field"><span class="detail-label">产品名称</span><span class="detail-value">' + escapeHtml(p.name) + '</span></div>'
            + '<div class="detail-field"><span class="detail-label">产品 ID</span><span class="detail-value"><span class="product-id-code">' + escapeHtml(p.productId) + '</span>'
            + ' <button class="btn btn-secondary btn-sm" onclick="copyText(\'' + escapeHtml(p.productId) + '\',this)" style="margin-left:6px;">复制</button></span></div>'
            + '<div class="detail-field"><span class="detail-label">租户</span><span class="detail-value">' + escapeHtml(p.tenantCode || '-') + '</span></div>'
            + '<div class="detail-field"><span class="detail-label">状态</span><span class="detail-value">'
            + (p.status === 1 ? '<span class="badge badge-active">启用</span>' : '<span class="badge badge-disabled">已禁用</span>')
            + '</span></div>'
            + '<div class="detail-field"><span class="detail-label">创建时间</span><span class="detail-value text-mono">' + formatDate(p.createdAt) + '</span></div>'
            + '<div class="detail-field" style="flex-direction:column;align-items:flex-start;gap:8px;"><span class="detail-label" style="margin-bottom:2px;">RSA 公钥</span>'
            + '<div style="font-size:12px;background:var(--clr-bg-elevated);padding:10px;border-radius:6px;max-height:120px;overflow:auto;word-break:break-all;line-height:1.6;width:100%;border:1px solid var(--clr-border);">'
            + escapeHtml(p.rsaPublicKey || '未生成') + '</div></div>'
            + '</div>';
          document.getElementById('modalTitle').textContent = '产品详情 — ' + escapeHtml(p.name);
          document.getElementById('modalBody').innerHTML = detailHtml
            + '<div class="modal-actions"><button class="btn btn-secondary" onclick="hideCreateTenant()">关闭</button></div>';
          document.getElementById('tenantModal').style.display = 'flex';
        })
        .catch(function (err) {
          window.toast(err.message || '加载失败', 'error');
        });
    }

    function formatDate(d) {
      if (!d) return '-';
      return d.replace('T', ' ').substring(0, 16);
    }

    function escapeHtml(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
